services:
  app:
    build: .
    container_name: goblog-app
    restart: always
    ports:
      - "8080:8080"
    environment:
      # 覆盖配置文件中的设置
      - GOBLOG_PORT=8080
      - GOBLOG_MYSQL_DSN=root:rootpassword@tcp(mysql:3306)/goblog?charset=utf8mb4&parseTime=True&loc=Local
      - GOBLOG_REDIS_ADDR=redis:6379
      - GOBLOG_REDIS_PASSWORD=
      - GOBLOG_REDIS_DB=0
      - GOBLOG_JWT_SECRET=your-secret-key-change-it
    depends_on:
      - mysql
      - redis
    volumes:
      - ./logs:/app/logs
      - ./web/static/uploads:/app/web/static/uploads

  mysql:
    image: mysql:5.7
    container_name: goblog-mysql
    restart: always
    environment:
      - MYSQL_ROOT_PASSWORD=rootpassword
      - MYSQL_DATABASE=goblog
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci

  redis:
    image: redis:alpine
    container_name: goblog-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  mysql_data:
  redis_data:
